# Builds the release binaries with misc/release.sh and misc/release.bat for
# all supported platforms. Run it from the Actions tab ("Build release
# binaries") or with
#
#   gh workflow run release.yml [-f ref=<commit>] [-f release=<tag>]
#
# "ref" is the branch, tag or commit to build. Left empty, it is the branch
# the workflow is run on. "release" is the tag of an existing GitHub release
# to attach the ZIP files to. Left empty, nothing is uploaded to a release.
# Either way, the ZIP files are available as artifacts of the workflow run.
#
# Each build also has to pass the CP/M self test before its ZIP file is kept
# or uploaded. The other targets need graphical emulators, so their
# self tests remain manual.

name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (default is the branch the workflow runs on)
        required: false
        default: ''
      release:
        description: Tag of an existing release to attach the binaries to (leave empty to skip)
        required: false
        default: ''

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE: ${{ inputs.release }}
  REF: ${{ inputs.ref || github.sha }}
  SJASMPLUS: 1.24.0
  TNYLPO: 1.2.2-bin

jobs:
  check:
    name: Check release
    runs-on: ubuntu-latest
    steps:
      - name: Make sure the release exists
        if: env.RELEASE != ''
        run: gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json name,isDraft

  # Native builds on GitHub's own runners.
  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            artifact: pasta80-Darwin-arm64
            runner: macos-latest
            fpc: brew
            tnylpo: macos-universal
          - name: macOS x86_64
            artifact: pasta80-Darwin-x86_64
            runner: macos-15-intel
            fpc: macos
            tnylpo: macos-universal
          - name: Linux x86_64
            artifact: pasta80-Linux-x86_64
            runner: ubuntu-latest
            fpc: apt
            tnylpo: linux-x86_64
          - name: Linux arm64
            artifact: pasta80-Linux-aarch64
            runner: ubuntu-24.04-arm
            fpc: apt
            tnylpo: linux-arm64
          - name: Windows x86_64
            artifact: pasta80-Windows-AMD64
            runner: windows-latest
            fpc: lazarus
            tnylpo: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      # The official installer refuses to install on current macOS versions,
      # but Homebrew has Free Pascal for Apple Silicon.
      - name: Install Free Pascal (Homebrew)
        if: matrix.fpc == 'brew'
        run: |
          brew install fpc
          fpc -iV

      # Homebrew is phasing out Intel, but the official installer still works
      # on the Intel runner (macOS 15).
      - name: Install Free Pascal (macOS)
        if: matrix.fpc == 'macos'
        run: |
          curl -fsSL -o fpc.dmg "https://sourceforge.net/projects/freepascal/files/Mac%20OS%20X/3.2.2/fpc-3.2.2.intelarm64-macosx.dmg/download"
          hdiutil attach -nobrowse -mountpoint /Volumes/fpc fpc.dmg
          ls -la /Volumes/fpc
          PKG=$(find /Volumes/fpc -maxdepth 2 \( -name '*.pkg' -o -name '*.mpkg' \) | head -1)
          sudo installer -pkg "$PKG" -target /
          hdiutil detach /Volumes/fpc
          rm fpc.dmg
          fpc -iV

      - name: Install Free Pascal (Linux)
        if: matrix.fpc == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fpc zip
          fpc -iV

      # The Free Pascal installers for Windows only come with a 32 bit compiler
      # (plus a cross compiler). Lazarus brings a native 64 bit one.
      - name: Install Free Pascal (Windows)
        if: matrix.fpc == 'lazarus'
        shell: pwsh
        run: |
          choco install lazarus -y --no-progress
          $Bin = (Get-ChildItem C:\lazarus\fpc\*\bin\x86_64-win64\fpc.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $Bin
          & "$Bin\fpc.exe" -iV

      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: misc/release.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call misc\release.bat

      - name: Check binary
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) file pasta80.exe; file pasta80.exe | grep -q 'x86-64' ;;
            macOS)   file pasta80; file pasta80 | grep -q "$(uname -m)" ;;
            Linux)   file pasta80; file pasta80 | grep -q 'statically linked' ;;
          esac

      # The self test needs sjasmplus and tnylpo. There are no sjasmplus
      # binaries for macOS and Linux, so it is built from source there.
      - name: Install sjasmplus and tnylpo (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://github.com/z00m128/sjasmplus/releases/download/v$SJASMPLUS/sjasmplus-$SJASMPLUS-src.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/sjasmplus-$SJASMPLUS" -j4 > /dev/null
          echo "$RUNNER_TEMP/sjasmplus-$SJASMPLUS" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/tnylpo.zip" "https://github.com/pleumann/tnylpo/releases/download/$TNYLPO/tnylpo-${{ matrix.tnylpo }}.zip"
          unzip -q "$RUNNER_TEMP/tnylpo.zip" -d "$RUNNER_TEMP/tnylpo"
          echo "$RUNNER_TEMP/tnylpo" >> "$GITHUB_PATH"

      - name: Install sjasmplus and tnylpo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile "$env:RUNNER_TEMP\sjasmplus.zip" "https://github.com/z00m128/sjasmplus/releases/download/v$env:SJASMPLUS/sjasmplus-$env:SJASMPLUS.win.zip"
          Expand-Archive "$env:RUNNER_TEMP\sjasmplus.zip" "$env:RUNNER_TEMP\sjasmplus"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\sjasmplus\sjasmplus-$env:SJASMPLUS.win"
          Invoke-WebRequest -OutFile "$env:RUNNER_TEMP\tnylpo.zip" "https://github.com/pleumann/tnylpo/releases/download/$env:TNYLPO/tnylpo-${{ matrix.tnylpo }}.zip"
          Expand-Archive "$env:RUNNER_TEMP\tnylpo.zip" "$env:RUNNER_TEMP\tnylpo"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\tnylpo"

      # Runs after the ZIP file has been made, so the test output doesn't end
      # up in it. Fails the job (and skips the upload) unless all tests pass.
      - name: Self test (CP/M)
        shell: bash
        run: ./pasta80 --selftest

      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pasta80-*.zip
          if-no-files-found: error

      - name: Upload to release
        if: env.RELEASE != ''
        shell: bash
        run: gh release upload "$RELEASE" pasta80-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  # 32 bit ARMv6 with hard float for the Raspberry Pi Zero (and NextPi). Built
  # natively in an emulated Raspberry Pi OS, whose fpc generates ARMv6 code.
  # There is no tnylpo for ARMv6, so the self test runs the binary under
  # qemu-arm on the runner instead, with x86_64 builds of the tools.
  build-armv6:
    name: Linux armv6l (Pi Zero)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Build in emulated Raspberry Pi OS
        uses: pguyot/arm-runner-action@v2
        with:
          cpu: arm1176
          cpu_info: cpuinfo/raspberrypi_zero_w
          base_image: raspios_lite:latest
          image_additional_mb: 1024
          copy_artifact_path: pasta80-*.zip
          commands: |
            set -e
            test "$(uname -m)" = armv6l
            apt-get update
            apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl git zip file binutils
            git config --system --add safe.directory '*'
            fpc -iV
            misc/release.sh
            file pasta80
            file pasta80 | grep -q 'statically linked'
            readelf -A pasta80
            if readelf -A pasta80 | grep -Eq 'Tag_CPU_arch: v(7|8)'; then exit 1; fi
            ./pasta80 --version

      - name: Install qemu, sjasmplus and tnylpo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          curl -fsSL "https://github.com/z00m128/sjasmplus/releases/download/v$SJASMPLUS/sjasmplus-$SJASMPLUS-src.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/sjasmplus-$SJASMPLUS" -j4 > /dev/null
          echo "$RUNNER_TEMP/sjasmplus-$SJASMPLUS" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/tnylpo.zip" "https://github.com/pleumann/tnylpo/releases/download/$TNYLPO/tnylpo-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/tnylpo.zip" -d "$RUNNER_TEMP/tnylpo"
          echo "$RUNNER_TEMP/tnylpo" >> "$GITHUB_PATH"

      # Unpacks the ZIP file elsewhere, so the test output doesn't end up in
      # it. -cpu arm1176 also makes sure the binary contains only ARMv6 code.
      - name: Self test (CP/M)
        run: |
          unzip -q pasta80-*.zip -d "$RUNNER_TEMP/selftest"
          cd "$RUNNER_TEMP/selftest"
          qemu-arm -cpu arm1176 ./pasta80 --selftest

      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pasta80-Linux-armv6l
          path: pasta80-*.zip
          if-no-files-found: error

      - name: Upload to release
        if: env.RELEASE != ''
        run: gh release upload "$RELEASE" pasta80-*.zip --clobber --repo "$GITHUB_REPOSITORY"
